# This is a Databricks asset bundle definition for test2.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test2
  uuid: 28b61972-5a0d-4610-947a-466c2fa26970

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
    variables:
      catalog: main
      schema: ${workspace.current_user.short_name}
      notifications: []

  prod:
    mode: production
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jengler@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jengler@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: jengler@databricks.com
        level: CAN_MANAGE
    variables:
      catalog: main
      schema: default
      notifications: [jengler@databricks.com]
