# This is a Databricks asset bundle definition for test3.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test3
  uuid: a3996e2e-e1bb-4d3e-ab7b-a81f09791a3a

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jengler@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jengler@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: jengler@databricks.com
        level: CAN_MANAGE
